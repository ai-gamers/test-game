<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>対戦待ち一覧</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'DotGothic16', sans-serif;
            background-color: #e0e0e0;
        }
        .pixel-border {
            border: 6px solid #333;
        }
        .pixel-border-sm {
            border: 4px solid #333;
        }
        .pixel-shadow {
            box-shadow: 12px 12px 0px 0px rgba(0,0,0,0.1);
        }
        .item-shadow {
            box-shadow: 6px 6px 0px 0px rgba(51,51,51,1);
        }
        /* アニメーション */
        @keyframes pulse-white {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .animate-pulse-custom {
            animation: pulse-white 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

    <div id="app" class="max-w-xl mx-auto bg-white pixel-border pixel-shadow overflow-hidden">
        <!-- ヘッダー -->
        <div class="bg-[#ee1515] p-6 border-b-[6px] border-[#333]">
            <h1 class="text-white text-3xl font-black italic tracking-widest" style="text-shadow: 2px 2px 0px #000;">
                たいせんまち いちらん
            </h1>
            <div class="flex items-center gap-2 mt-2">
                <div class="h-2 w-full bg-[#333]/30 rounded-full overflow-hidden">
                    <div class="h-full bg-white w-1/3 animate-pulse-custom"></div>
                </div>
                <span class="text-white text-[10px] font-bold whitespace-nowrap uppercase">ライブ こうしんちゅう</span>
            </div>
        </div>

        <div class="p-6 bg-white">
            <!-- 入力エリア -->
            <form id="add-form" class="mb-10">
                <div class="flex flex-col gap-1 mb-2">
                    <span class="text-[#333] text-sm font-black italic">つぎの ちょうせんしゃ：</span>
                </div>
                <div class="flex">
                    <input
                        id="name-input"
                        type="text"
                        required
                        placeholder="なまえを にゅうりょく！"
                        class="flex-1 border-[4px] border-[#333] p-4 text-xl focus:outline-none focus:bg-yellow-50 placeholder-gray-300"
                    />
                    <button
                        type="submit"
                        class="bg-[#333] text-white px-8 font-black text-lg border-[4px] border-l-0 border-[#333] hover:bg-red-600 transition-colors active:translate-y-1"
                    >
                        ついか
                    </button>
                </div>
            </form>

            <!-- リスト表示エリア -->
            <div id="waitlist-container" class="space-y-4">
                <div class="border-[4px] border-dotted border-gray-300 p-10 text-center text-gray-300 font-black text-xl italic">
                    よみこみちゅう...
                </div>
            </div>
        </div>

        <!-- フッター -->
        <div class="bg-[#333] p-4 flex justify-between items-center text-white overflow-hidden">
            <div class="flex gap-1">
                <div class="w-2 h-2 bg-red-500"></div>
                <div class="w-2 h-2 bg-red-500"></div>
                <div class="w-2 h-2 bg-red-500"></div>
            </div>
            <span class="text-[11px] font-black tracking-[0.3em] uppercase opacity-80">
                つうしん たいきじょうたい
            </span>
            <div class="flex gap-1">
                <div class="w-2 h-2 bg-white/20"></div>
                <div class="w-2 h-2 bg-white/20"></div>
                <div class="w-2 h-2 bg-white/20"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment Variables
        const firebaseConfig = {
  apiKey: "AIzaSyD-doc3VpTgreIIpSJhLU3BM-nFjTBk42M",
  authDomain: "poke-battle-8f6b9.firebaseapp.com",
  projectId: "poke-battle-8f6b9",
  storageBucket: "poke-battle-8f6b9.firebasestorage.app",
  messagingSenderId: "1041885914810",
  appId: "1:1041885914810:web:426d0c25c499b152f88483",
  measurementId: "G-RGE3SEGTYL"
};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pokemon-waitlist-html';
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const container = document.getElementById('waitlist-container');
        const form = document.getElementById('add-form');
        const input = document.getElementById('name-input');

        let currentUser = null;

        // Auth Flow
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error:", err);
            }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                startSync();
            }
        });

        initAuth();

        // Start Real-time Sync
        function startSync() {
            if (!currentUser) return;

            const waitlistRef = collection(db, 'artifacts', appId, 'public', 'data', 'waitlist');
            
            onSnapshot(waitlistRef, (snapshot) => {
                const items = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                // Sort by creation time in memory
                const sortedItems = items.sort((a, b) => {
                    const timeA = a.createdAt?.seconds || 0;
                    const timeB = b.createdAt?.seconds || 0;
                    return timeA - timeB;
                });
                
                renderList(sortedItems);
            }, (error) => {
                console.error("Firestore error:", error);
                container.innerHTML = `<div class="text-red-500 text-center font-bold">エラーが発生しました。</div>`;
            });
        }

        // Render List HTML
        function renderList(list) {
            if (list.length === 0) {
                container.innerHTML = `
                    <div class="border-[4px] border-dotted border-gray-300 p-10 text-center text-gray-300 font-black text-xl italic">
                        ちょうせんしゃを まっています...
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map((player, index) => `
                <div class="flex items-center justify-between border-[4px] border-[#333] p-5 bg-white item-shadow relative overflow-hidden group hover:bg-yellow-50 transition-colors">
                    <div class="absolute top-0 left-0 w-8 h-8 bg-[#333] transform -rotate-45 -translate-x-4 -translate-y-4"></div>
                    
                    <div class="flex items-baseline gap-4 relative z-10">
                        <span class="text-3xl font-black text-red-600 italic">#${index + 1}</span>
                        <div class="flex flex-col">
                            <span class="text-[10px] text-gray-400 font-bold uppercase">ちょうせんしゃ</span>
                            <span class="text-2xl font-black text-[#333] leading-none uppercase">${escapeHtml(player.name)}</span>
                        </div>
                    </div>
                    
                    <button
                        onclick="removePlayer('${player.id}')"
                        class="p-3 bg-white border-[3px] border-[#333] text-[#333] hover:bg-red-600 hover:text-white transition-all transform hover:rotate-12"
                    >
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        // Actions
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = input.value.trim();
            if (!name || !currentUser) return;

            const docId = crypto.randomUUID();
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'waitlist', docId);
            
            try {
                await setDoc(docRef, {
                    name: name,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            } catch (err) {
                console.error("Add error:", err);
            }
        });

        window.removePlayer = async (id) => {
            if (!currentUser) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'waitlist', id);
                await deleteDoc(docRef);
            } catch (err) {
                console.error("Delete error:", err);
            }
        };

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
