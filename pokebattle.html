<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿題共有ボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .day-btn.active { @apply bg-indigo-600 text-white shadow-md; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 font-sans min-h-screen pb-20">

    <!-- 読み込み中オーバーレイ -->
    <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-50">
        <div class="flex flex-col items-center gap-3">
            <i data-lucide="loader-2" class="text-indigo-500 animate-spin w-8 h-8"></i>
            <p class="text-slate-500 font-medium text-sm">データベースに接続中...</p>
        </div>
    </div>

    <div class="lg:flex lg:justify-center lg:items-start lg:pt-8 max-w-6xl mx-auto">
        <!-- メインコンテンツ -->
        <main class="w-full max-w-xl px-4 py-8 lg:py-0">
            <!-- ヘッダー -->
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-3">
                    <div class="bg-indigo-600 p-2.5 rounded-xl shadow-indigo-200 shadow-lg text-white">
                        <i data-lucide="calendar-days"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black tracking-tight leading-tight text-slate-800">宿題共有ボード</h1>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Global Synchronization</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-200 rounded-full text-[10px] font-bold text-slate-500 shadow-sm">
                    <i data-lucide="users" class="text-indigo-500 w-3 h-3"></i>
                    全員で共有中
                </div>
            </div>

            <!-- 曜日ナビゲーション -->
            <div id="day-nav" class="flex justify-between gap-1 mb-6 bg-white p-1.5 rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
                <!-- JSで生成 -->
            </div>

            <!-- 入力フォーム -->
            <form id="add-task-form" class="relative mb-8">
                <input
                    type="text"
                    id="task-input"
                    placeholder="宿題を追加..."
                    class="w-full pl-5 pr-14 py-4 bg-white border-2 border-transparent rounded-2xl shadow-sm focus:border-indigo-500 focus:outline-none transition-all placeholder:text-slate-300"
                    required
                >
                <button
                    type="submit"
                    id="submit-btn"
                    class="absolute right-2 top-2 bottom-2 px-4 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all shadow-sm flex items-center justify-center disabled:bg-slate-200"
                >
                    <i data-lucide="plus" id="btn-icon-plus"></i>
                    <i data-lucide="loader-2" id="btn-icon-loader" class="hidden animate-spin"></i>
                </button>
            </form>

            <!-- 宿題リスト -->
            <div id="task-list" class="space-y-3">
                <!-- JSで生成 -->
            </div>
        </main>

        <!-- サマリーサイドバー -->
        <aside class="w-full max-w-xl lg:max-w-xs px-4 pb-12 lg:pb-0">
            <div class="bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden sticky top-8">
                <div class="bg-slate-50 px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                    <h2 class="text-sm font-black text-slate-700 flex items-center gap-2 italic">
                        <i data-lucide="layout-list" class="text-indigo-600 w-4 h-4"></i>
                        WEEKLY SUMMARY
                    </h2>
                    <span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-bold">ReadOnly</span>
                </div>
                
                <div id="summary-content" class="p-4 space-y-4 max-h-[60vh] overflow-y-auto">
                    <!-- JSで生成 -->
                </div>

                <div class="p-4 bg-slate-50 border-t border-slate-100">
                    <div class="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
                        <div id="total-progress-bar" class="bg-indigo-500 h-full transition-all duration-1000 w-0"></div>
                    </div>
                    <p class="mt-2 text-[9px] text-center font-bold text-slate-400 tracking-tighter uppercase">Weekly Progress</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyD-doc3VpTgreIIpSJhLU3BM-nFjTBk42M",
            authDomain: "poke-battle-8f6b9.firebaseapp.com",
            projectId: "poke-battle-8f6b9",
            storageBucket: "poke-battle-8f6b9.firebasestorage.app",
            messagingSenderId: "1041885914810",
            appId: "1:1041885914810:web:426d0c25c499b152f88483",
            measurementId: "G-RGE3SEGTYL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // App identifier for collection path
        const appId = 'shared-homework-board-v1';

        // 金曜日(5)から始まる配列
        const DAYS = ['金', '土', '日', '月', '火', '水', '木'];
        const DAY_MAP = { 5:0, 6:1, 0:2, 1:3, 2:4, 3:5, 4:6 };
        
        let currentDayIdx = DAY_MAP[new Date().getDay()] || 0;
        let homeworks = [];
        let currentUser = null;

        // --- DOM Elements ---
        const taskListEl = document.getElementById('task-list');
        const dayNavEl = document.getElementById('day-nav');
        const taskInputEl = document.getElementById('task-input');
        const addTaskForm = document.getElementById('add-task-form');
        const summaryContentEl = document.getElementById('summary-content');
        const progressBarEl = document.getElementById('total-progress-bar');
        const loadingOverlay = document.getElementById('loading-overlay');
        const submitBtn = document.getElementById('submit-btn');
        const btnIconPlus = document.getElementById('btn-icon-plus');
        const btnIconLoader = document.getElementById('btn-icon-loader');

        // --- Initialize ---
        async function init() {
            try {
                // Anonymous auth is required for Firestore rules in this environment
                await signInAnonymously(auth);
            } catch (err) {
                console.error("Authentication failed:", err);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    loadingOverlay.classList.add('hidden');
                    startSync();
                }
            });

            renderDayNav();
            updateInputPlaceholder();
            lucide.createIcons();
        }

        function renderDayNav() {
            dayNavEl.innerHTML = '';
            DAYS.forEach((day, i) => {
                const btn = document.createElement('button');
                const isActive = currentDayIdx === i;
                btn.className = `flex-1 min-w-[44px] py-3 rounded-xl text-sm font-bold transition-all duration-200 ${isActive ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-50 hover:text-slate-600'}`;
                btn.textContent = day;
                btn.onclick = () => {
                    currentDayIdx = i;
                    renderDayNav();
                    renderTasks();
                    updateInputPlaceholder();
                };
                dayNavEl.appendChild(btn);
            });
        }

        function updateInputPlaceholder() {
            taskInputEl.placeholder = `${DAYS[currentDayIdx]}曜日の宿題を追加...`;
        }

        function startSync() {
            // Path following mandatory rules for public data
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'homeworks');
            onSnapshot(query(colRef), (snapshot) => {
                homeworks = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                homeworks.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                renderTasks();
                renderSummary();
            }, (error) => {
                console.error("Firestore sync error:", error);
            });
        }

        // --- Actions (Global Functions) ---
        window.cycleStatus = async (id, currentStatus) => {
            if (!currentUser) return;
            const next = { todo: 'doing', doing: 'done', done: 'todo' }[currentStatus];
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'homeworks', id);
            try {
                await updateDoc(docRef, { status: next });
            } catch (e) {
                console.error("Update error:", e);
            }
        };

        window.removeTask = async (id) => {
            if (!currentUser) return;
            if (!confirm('この宿題を削除しますか？')) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'homeworks', id);
                await deleteDoc(docRef);
            } catch (e) {
                console.error("Delete error:", e);
            }
        };

        addTaskForm.onsubmit = async (e) => {
            e.preventDefault();
            const text = taskInputEl.value.trim();
            if (!text || !currentUser) return;

            submitBtn.disabled = true;
            btnIconPlus.classList.add('hidden');
            btnIconLoader.classList.remove('hidden');

            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'homeworks');
                await addDoc(colRef, {
                    text,
                    day: currentDayIdx,
                    status: 'todo',
                    createdAt: Date.now(),
                    author: currentUser.uid
                });
                taskInputEl.value = '';
            } catch (err) {
                console.error("Add task error:", err);
            } finally {
                submitBtn.disabled = false;
                btnIconPlus.classList.remove('hidden');
                btnIconLoader.classList.add('hidden');
            }
        };

        // --- Rendering ---
        function renderTasks() {
            const filtered = homeworks.filter(h => h.day === currentDayIdx);
            taskListEl.innerHTML = '';

            if (filtered.length === 0) {
                taskListEl.innerHTML = `
                    <div class="flex items-center justify-center gap-2 py-4 bg-slate-50/50 rounded-2xl border border-dashed border-slate-200">
                        <i data-lucide="inbox" class="text-slate-300 w-4 h-4"></i>
                        <p class="text-slate-400 text-xs font-medium italic">${DAYS[currentDayIdx]}曜日の宿題はありません</p>
                    </div>
                `;
            } else {
                filtered.forEach(item => {
                    const statusInfo = {
                        todo: { bg: 'bg-white', border: 'border-slate-200', text: 'text-slate-700', icon: 'circle', iconColor: 'text-slate-300' },
                        doing: { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-800', icon: 'loader-2', iconColor: 'text-blue-500 animate-spin-slow' },
                        done: { bg: 'bg-green-50', border: 'border-green-200', text: 'text-green-600 line-through', icon: 'check-circle-2', iconColor: 'text-green-500' }
                    }[item.status];

                    const div = document.createElement('div');
                    div.className = `flex items-center gap-3 p-4 border rounded-2xl shadow-sm transition-all duration-300 ${statusInfo.bg} ${statusInfo.border}`;
                    div.innerHTML = `
                        <button onclick="cycleStatus('${item.id}', '${item.status}')" class="p-1 focus:outline-none">
                            <i data-lucide="${statusInfo.icon}" class="${statusInfo.iconColor} w-5 h-5"></i>
                        </button>
                        <span class="flex-1 font-medium ${statusInfo.text} truncate">${item.text}</span>
                        <button onclick="removeTask('${item.id}')" class="text-slate-300 hover:text-red-500 p-2 transition-colors focus:outline-none">
                            <i data-lucide="trash-2" class="w-4.5 h-4.5"></i>
                        </button>
                    `;
                    taskListEl.appendChild(div);
                });
            }
            lucide.createIcons();
        }

        function renderSummary() {
            summaryContentEl.innerHTML = '';
            DAYS.forEach((dayName, idx) => {
                const dayTasks = homeworks.filter(h => h.day === idx);
                const doneCount = dayTasks.filter(t => t.status === 'done').length;

                const daySection = document.createElement('div');
                daySection.className = 'space-y-1.5';
                
                let tasksHtml = dayTasks.length > 0 
                    ? dayTasks.map(t => `
                        <div class="flex items-center gap-2 pl-2 border-l-2 border-slate-100">
                            ${t.status === 'done' 
                                ? '<i data-lucide="check-circle" class="text-green-500 w-2.5 h-2.5"></i>' 
                                : `<div class="w-2.5 h-2.5 rounded-full ${t.status === 'doing' ? 'bg-blue-400' : 'bg-slate-200'}"></div>`}
                            <span class="text-[11px] truncate ${t.status === 'done' ? 'text-slate-300 line-through' : 'text-slate-600'}">${t.text}</span>
                        </div>
                    `).join('')
                    : '<div class="h-px bg-slate-50 w-full"></div>';

                daySection.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold ${dayTasks.length > 0 ? 'text-slate-800' : 'text-slate-300'}">${dayName}曜日</span>
                        ${dayTasks.length > 0 ? `<span class="text-[10px] text-slate-400 font-medium">${doneCount} / ${dayTasks.length}</span>` : ''}
                    </div>
                    <div class="space-y-1">${tasksHtml}</div>
                `;
                summaryContentEl.appendChild(daySection);
            });

            const total = homeworks.length;
            const doneTotal = homeworks.filter(t => t.status === 'done').length;
            progressBarEl.style.width = `${total > 0 ? (doneTotal / total) * 100 : 0}%`;

            lucide.createIcons();
        }

        init();
    </script>
</body>
</html>
