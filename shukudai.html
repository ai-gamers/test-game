<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1週間の宿題 - Shared Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap');
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        .tab-btn.active {
            color: #4f46e5 !important;
            background-color: #ffffff !important;
            border-bottom: 3px solid #4f46e5 !important;
        }
        #loading-overlay { transition: opacity 0.3s; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto space-y-6 relative">
        
        <!-- Header -->
        <header class="flex items-center justify-between bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332 0.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332 0.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332 0.477-4.5 1.253" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight leading-none text-slate-800">1週間の宿題</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="status-dot" class="status-dot bg-gray-400"></span>
                        <p id="conn-status" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">接続中...</p>
                    </div>
                </div>
            </div>
            <button id="clear-all-btn" class="text-xs font-bold text-red-500 hover:text-red-700 transition-colors flex items-center gap-1 p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                全クリア
            </button>
        </header>

        <!-- Tab & Input Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative">
            
            <!-- Loading Indicator -->
            <div id="loading-overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-10 flex flex-col items-center justify-center gap-2">
                <div class="animate-spin h-5 w-5 border-2 border-indigo-600 border-t-transparent rounded-full"></div>
                <span class="text-[10px] font-bold text-indigo-600 uppercase tracking-[0.2em]">同期中</span>
            </div>

            <!-- Tabs -->
            <div class="flex bg-slate-100 border-b border-slate-200" id="tabs-container"></div>

            <!-- Single Input -->
            <div class="p-5">
                <div class="relative">
                    <input 
                        id="hw-input-field" 
                        type="text" 
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all text-slate-800 font-medium"
                        placeholder="宿題の内容を入力..."
                    >
                    <div id="save-msg" class="absolute right-3 top-3.5 text-[10px] font-bold text-emerald-500 uppercase tracking-widest opacity-0 transition-opacity pointer-events-none">
                        保存完了
                    </div>
                </div>
            </div>
        </section>

        <!-- Live Summary Board -->
        <section class="space-y-3">
            <div class="flex items-center gap-2 px-2">
                <div class="h-1 w-3 bg-indigo-500 rounded-full"></div>
                <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Live Summary</h2>
            </div>
            <div class="bg-slate-900 rounded-2xl p-2 shadow-xl border border-slate-800" id="summary-display"></div>
        </section>

        <footer class="text-[10px] text-center text-gray-400 font-bold uppercase tracking-[0.2em] pt-4">
            Cloud Shared Homework Planner
        </footer>

        <!-- Confirm Modal -->
        <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                <h3 class="text-lg font-bold text-slate-900 mb-2">データの全消去</h3>
                <p class="text-slate-500 text-sm mb-6">共有している全員の画面から全ての宿題が消去されます。よろしいですか？</p>
                <div class="flex gap-3">
                    <button id="modal-cancel-btn" class="flex-1 px-4 py-2 bg-slate-100 rounded-xl font-bold">キャンセル</button>
                    <button id="modal-confirm-btn" class="flex-1 px-4 py-2 bg-red-500 text-white rounded-xl font-bold">消去する</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-doc3VpTgreIIpSJhLU3BM-nFjTBk42M",
            authDomain: "poke-battle-8f6b9.firebaseapp.com",
            projectId: "poke-battle-8f6b9",
            storageBucket: "poke-battle-8f6b9.firebasestorage.app",
            messagingSenderId: "1041885914810",
            appId: "1:1041885914810:web:426d0c25c499b152f88483",
            measurementId: "G-RGE3SEGTYL"
        };

        const DB_KEY_LOCAL = 'hw_backup_local_shared';
        const DAYS = ["金", "土", "日", "月", "火", "水", "木"];
        let homeworkStore = JSON.parse(localStorage.getItem(DB_KEY_LOCAL)) || { "金":"", "土":"", "日":"", "月":"", "火":"", "水":"", "木":"" };
        let activeTab = "金";
        let isOnline = false;
        let debounceTimer;

        const tabsBox = document.getElementById('tabs-container');
        const inputField = document.getElementById('hw-input-field');
        const summaryBox = document.getElementById('summary-display');
        const saveMsg = document.getElementById('save-msg');
        const connStatus = document.getElementById('conn-status');
        const statusDot = document.getElementById('status-dot');
        const loadingOverlay = document.getElementById('loading-overlay');

        function renderTabs() {
            tabsBox.innerHTML = '';
            DAYS.forEach(day => {
                const btn = document.createElement('button');
                btn.className = `tab-btn flex-1 py-4 text-sm font-black transition-all hover:bg-slate-200 text-slate-400 border-b-2 border-transparent ${day === activeTab ? 'active' : ''}`;
                btn.innerText = day;
                btn.onclick = () => switchTab(day);
                tabsBox.appendChild(btn);
            });
        }

        function switchTab(day) {
            activeTab = day;
            renderTabs();
            inputField.value = homeworkStore[day] || "";
            inputField.focus();
        }

        function renderSummary() {
            summaryBox.innerHTML = '';
            DAYS.forEach(day => {
                const text = (homeworkStore[day] || "").trim();
                let dayStyle = 'text-slate-500 bg-slate-800';
                if (day === '土') dayStyle = 'text-blue-400 bg-blue-900/40';
                if (day === '日') dayStyle = 'text-red-400 bg-red-900/40';

                summaryBox.insertAdjacentHTML('beforeend', `
                    <div class="flex items-center gap-4 p-3 border-b border-slate-800 last:border-0 hover:bg-slate-800/30 transition-colors">
                        <div class="w-8 h-8 flex items-center justify-center rounded-lg font-black text-xs ${dayStyle}">${day}</div>
                        <div class="flex-1 truncate text-sm font-medium ${text ? 'text-slate-100' : 'text-slate-600 italic'}">${text || '未設定'}</div>
                    </div>
                `);
            });
        }

        async function startFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);
                
                await signInAnonymously(auth);
                
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'shared-v1';
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'homework_board', 'shared_data');

                onSnapshot(docRef, (snap) => {
                    if (snap.exists()) {
                        homeworkStore = snap.data();
                        localStorage.setItem(DB_KEY_LOCAL, JSON.stringify(homeworkStore));
                        renderSummary();
                        if (document.activeElement !== inputField) inputField.value = homeworkStore[activeTab] || "";
                    }
                    updateStatus(true);
                }, (err) => {
                    console.error("Firestore error:", err);
                    updateStatus(false, "権限エラーまたはDB未作成");
                });

                inputField.addEventListener('input', (e) => {
                    homeworkStore[activeTab] = e.target.value;
                    localStorage.setItem(DB_KEY_LOCAL, JSON.stringify(homeworkStore));
                    renderSummary();
                    
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(async () => {
                        if (isOnline) {
                            try {
                                await setDoc(docRef, homeworkStore);
                                flashSaved();
                            } catch (e) { updateStatus(false); }
                        }
                    }, 500);
                });

                document.getElementById('modal-confirm-btn').onclick = async () => {
                    DAYS.forEach(d => homeworkStore[d] = "");
                    localStorage.setItem(DB_KEY_LOCAL, JSON.stringify(homeworkStore));
                    renderSummary();
                    inputField.value = "";
                    if (isOnline) await setDoc(docRef, homeworkStore);
                    document.getElementById('confirm-modal').classList.add('hidden');
                };

            } catch (e) {
                console.error("Auth error:", e);
                updateStatus(false, "ネットワークエラー");
            }
        }

        function updateStatus(online, msg) {
            isOnline = online;
            loadingOverlay.classList.add('hidden');
            if (online) {
                statusDot.className = "status-dot bg-emerald-500 animate-pulse";
                connStatus.innerText = "クラウド同期中";
                connStatus.className = "text-[10px] font-bold text-emerald-500 uppercase tracking-widest";
            } else {
                statusDot.className = "status-dot bg-amber-500";
                connStatus.innerText = msg || "オフライン（本体のみ保存）";
                connStatus.className = "text-[10px] font-bold text-amber-500 uppercase tracking-widest";
            }
        }

        function flashSaved() {
            saveMsg.style.opacity = '1';
            setTimeout(() => saveMsg.style.opacity = '0', 800);
        }

        renderTabs();
        renderSummary();
        inputField.value = homeworkStore[activeTab];
        document.getElementById('clear-all-btn').onclick = () => document.getElementById('confirm-modal').classList.remove('hidden');
        document.getElementById('modal-cancel-btn').onclick = () => document.getElementById('confirm-modal').classList.add('hidden');
        
        startFirebase();
    </script>
</body>
</html>
