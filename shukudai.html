<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW Planner - Shared Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .tab-btn.active {
            color: #4f46e5 !important;
            background-color: #ffffff !important;
            border-bottom: 3px solid #4f46e5 !important;
        }
        /* Loading overlay */
        #loading-overlay {
            transition: opacity 0.3s;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto space-y-6 relative">
        
        <!-- Header -->
        <header class="flex items-center justify-between bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <!-- Online Dot -->
                    <span id="online-dot" class="absolute -top-1 -right-1 w-3 h-3 bg-emerald-400 border-2 border-white rounded-full animate-pulse hidden"></span>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight uppercase italic leading-none">HW Planner</h1>
                    <p id="conn-status" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mt-1">Connecting...</p>
                </div>
            </div>
            <!-- Clear Button -->
            <button id="clear-all-btn" class="text-xs font-bold text-red-500 hover:text-red-700 transition-colors flex items-center gap-1 p-2 disabled:opacity-50">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                全クリア
            </button>
        </header>

        <!-- Tab & Input Section -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden relative">
            
            <!-- Loading Shield -->
            <div id="loading-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center gap-2">
                <svg class="animate-spin h-6 w-6 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-xs font-bold text-indigo-600 uppercase tracking-widest">Syncing Cloud...</span>
            </div>

            <!-- Day Tabs -->
            <div class="flex bg-gray-100 border-b border-gray-200" id="tabs-container">
                <!-- Tabs generated by JS -->
            </div>

            <!-- Single Line Input -->
            <div class="p-5">
                <div class="relative">
                    <input 
                        id="hw-input-field" 
                        type="text" 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all text-gray-800 font-medium"
                        placeholder="宿題を入力..."
                        disabled
                    >
                    <div id="save-msg" class="absolute right-3 top-3.5 text-[10px] font-bold text-emerald-500 uppercase tracking-widest opacity-0 transition-opacity pointer-events-none flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Cloud Saved
                    </div>
                </div>
            </div>
        </section>

        <!-- Read-Only Summary Section -->
        <section class="space-y-3">
            <div class="flex items-center gap-2 px-2 text-indigo-600">
                <div class="h-1 w-4 bg-indigo-500 rounded-full"></div>
                <h2 class="text-xs font-black uppercase tracking-widest">Live Weekly Summary</h2>
            </div>
            
            <div class="bg-gray-900 rounded-2xl p-2 shadow-xl border border-gray-800" id="summary-display">
                <!-- Summary items generated by JS -->
            </div>
        </section>

        <footer class="text-[10px] text-center text-gray-400 font-bold uppercase tracking-[0.2em] pt-4">
            Genius Logic System - Firebase Live Sync
        </footer>

        <!-- Custom Confirm Modal -->
        <div id="confirm-modal" class="hidden fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl transform transition-all">
                <div class="flex items-center gap-3 mb-2 text-red-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <h3 class="text-lg font-bold text-gray-900">全データの消去 (全体共有)</h3>
                </div>
                <p class="text-gray-500 text-sm mb-6 pl-9">すべての宿題内容が削除され、<strong>共有している全員の画面からも消去</strong>されます。本当によろしいですか？</p>
                <div class="flex gap-3">
                    <button id="modal-cancel-btn" class="flex-1 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold transition-colors">キャンセル</button>
                    <button id="modal-confirm-btn" class="flex-1 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold transition-colors">消去する</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase Logic as ES Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Provided Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-doc3VpTgreIIpSJhLU3BM-nFjTBk42M",
            authDomain: "poke-battle-8f6b9.firebaseapp.com",
            projectId: "poke-battle-8f6b9",
            storageBucket: "poke-battle-8f6b9.firebasestorage.app",
            messagingSenderId: "1041885914810",
            appId: "1:1041885914810:web:426d0c25c499b152f88483",
            measurementId: "G-RGE3SEGTYL"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Define standard paths for shared execution environment
        const sharedAppId = typeof __app_id !== 'undefined' ? __app_id : 'shared-hw-planner-default';
        const docPath = ['artifacts', sharedAppId, 'public', 'data', 'homework_board', 'shared_doc'];

        // App Constants & State
        const DAYS = ["金", "土", "日", "月", "火", "水", "木"];
        let homeworkStore = { "金": "", "土": "", "日": "", "月": "", "火": "", "水": "", "木": "" };
        let activeTab = "金";
        let currentUser = null;
        let isSyncing = false; // To prevent overwriting cursor while typing
        let debounceTimer;

        // DOM Elements
        const tabsBox = document.getElementById('tabs-container');
        const inputField = document.getElementById('hw-input-field');
        const summaryBox = document.getElementById('summary-display');
        const saveMsg = document.getElementById('save-msg');
        const clearBtn = document.getElementById('clear-all-btn');
        const confirmModal = document.getElementById('confirm-modal');
        const modalCancelBtn = document.getElementById('modal-cancel-btn');
        const modalConfirmBtn = document.getElementById('modal-confirm-btn');
        const loadingOverlay = document.getElementById('loading-overlay');
        const connStatus = document.getElementById('conn-status');
        const onlineDot = document.getElementById('online-dot');

        // --- Core UI Functions ---

        function renderTabs() {
            tabsBox.innerHTML = '';
            DAYS.forEach(day => {
                const btn = document.createElement('button');
                btn.id = `btn-${day}`;
                btn.className = 'tab-btn flex-1 py-4 text-sm font-black transition-all hover:bg-gray-200 text-gray-400 border-b-2 border-transparent';
                btn.innerText = day;
                btn.onclick = () => setActiveTab(day);
                tabsBox.appendChild(btn);
            });
        }

        function setActiveTab(day) {
            activeTab = day;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${day}`).classList.add('active');
            
            inputField.value = homeworkStore[day] || "";
            inputField.focus();
        }

        function renderSummary() {
            summaryBox.innerHTML = '';
            DAYS.forEach(day => {
                const text = (homeworkStore[day] || "").trim();
                let dayStyle = 'text-gray-500 bg-gray-800';
                
                if (day === '土') dayStyle = 'text-blue-400 bg-blue-900/40';
                if (day === '日') dayStyle = 'text-red-400 bg-red-900/40';

                const row = `
                    <div class="flex items-center gap-4 p-3 border-b border-gray-800 last:border-0 hover:bg-gray-800/30 transition-colors">
                        <div class="w-8 h-8 flex items-center justify-center rounded-lg font-black text-xs ${dayStyle}">
                            ${day}
                        </div>
                        <div class="flex-1 truncate">
                            <span class="text-sm font-medium ${text ? 'text-gray-100' : 'text-gray-600 italic'}">
                                ${text || '未設定'}
                            </span>
                        </div>
                    </div>
                `;
                summaryBox.insertAdjacentHTML('beforeend', row);
            });
        }

        function flashSaveIndicator() {
            saveMsg.style.opacity = '1';
            clearTimeout(window.saveTimer);
            window.saveTimer = setTimeout(() => {
                saveMsg.style.opacity = '0';
            }, 1000);
        }

        // --- Firebase Data Functions ---

        function saveToCloud() {
            if (!currentUser) return;
            const ref = doc(db, ...docPath);
            setDoc(ref, homeworkStore).then(() => {
                flashSaveIndicator();
            }).catch(err => {
                console.error("Cloud Save Error:", err);
            });
        }

        function setupRealtimeListener() {
            if (!currentUser) return;
            const ref = doc(db, ...docPath);
            
            onSnapshot(ref, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    // Update local store
                    DAYS.forEach(day => {
                        homeworkStore[day] = data[day] !== undefined ? data[day] : "";
                    });
                } else {
                    // Document doesn't exist yet, create it
                    saveToCloud();
                }

                // UI Updates
                renderSummary();
                
                // Only update the input field if the user is NOT actively typing
                if (document.activeElement !== inputField) {
                    inputField.value = homeworkStore[activeTab];
                }

                // Hide loading overlay on first load
                if (!loadingOverlay.classList.contains('hidden')) {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => {
                        loadingOverlay.classList.add('hidden');
                        inputField.disabled = false;
                        clearBtn.disabled = false;
                    }, 300);
                }

            }, (error) => {
                console.error("Snapshot error:", error);
                connStatus.innerText = "Connection Error";
                connStatus.classList.replace('text-emerald-500', 'text-red-500');
            });
        }

        // --- Authentication & Initialization ---

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth init error:", error);
                connStatus.innerText = "Auth Failed";
            }
        };

        // Start Auth
        initAuth();

        // Listen for Auth State Changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                connStatus.innerText = "Live Connected";
                connStatus.classList.replace('text-gray-400', 'text-emerald-500');
                onlineDot.classList.remove('hidden');
                setupRealtimeListener();
            } else {
                currentUser = null;
            }
        });

        // --- Event Listeners Setup ---
        
        // Initial Render
        renderTabs();
        renderSummary();
        setActiveTab("金");

        // Input Field Logic (with Debounce)
        inputField.addEventListener('input', (e) => {
            homeworkStore[activeTab] = e.target.value;
            renderSummary(); // Optimistic local UI update
            
            // Debounce Cloud Save (Wait 500ms after user stops typing)
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                saveToCloud();
            }, 500);
        });

        // Modal Logic for Clear All
        clearBtn.addEventListener('click', () => {
            confirmModal.classList.remove('hidden');
        });

        modalCancelBtn.addEventListener('click', () => {
            confirmModal.classList.add('hidden');
        });

        modalConfirmBtn.addEventListener('click', () => {
            DAYS.forEach(day => {
                homeworkStore[day] = "";
            });
            inputField.value = "";
            renderSummary();
            saveToCloud();
            confirmModal.classList.add('hidden');
        });

    </script>
</body>
</html>
