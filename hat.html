<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>帽子を授けろ！</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
:root{--bg:#10243a;--fg:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0b1826;--fg:#fff}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:9/16;background:#6ec6e8}
#mb{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:#0009;color:#fff;font-size:20px}
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<button id="mb" aria-label="BGM">🔊</button>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=360,H=640;
let best=0;try{best=+localStorage.getItem('hatbest')||0}catch(e){}
let state='title',score=0,time=40,hats=[],kid,pops=[],lastThrow=0,t0;
const cap={x:180,y:560};
function reset(){score=0;time=40;hats=[];pops=[];lastThrow=0;spawnKid(true);state='play'}
function spawnKid(first){kid={x:60+Math.random()*240,y:150+Math.random()*200,fx:0,fy:0,tx:0,ty:0,dash:0,cd:first?0.5:0.8,ph:Math.random()*6,face:1,hit:0}}
function throwHat(x,y){
  if(performance.now()-lastThrow<320)return;lastThrow=performance.now();
  y=Math.min(y,500);hats.push({sx:cap.x,sy:cap.y-50,tx:x,ty:y,t:0,dur:0.45,done:false});
}
function pt(e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)/r.width*W,(p.clientY-r.top)/r.height*H]}
function down(e){startMusic();const[x,y]=pt(e);
  if(state!=='play'){if(state==='title'||performance.now()-t0>600)reset();return}
  throwHat(x,y)}
window.addEventListener('pointerdown',down);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function update(dt){
  if(state!=='play')return;
  time-=dt;if(time<=0){time=0;state='over';t0=performance.now();if(score>best){best=score;try{localStorage.setItem('hatbest',best)}catch(e){}}}
  const k=kid;k.ph+=dt;k.cd-=dt;k.hit-=dt;
  const cdMax=Math.max(0.4,0.95-0.07*score);
  if(k.dash>0){k.dash-=dt;const p=1-Math.max(0,k.dash)/0.18;k.x=k.fx+(k.tx-k.fx)*p;k.y=k.fy+(k.ty-k.fy)*p}
  else if(k.hit<=0){k.x+=Math.sin(k.ph*2.6)*(130+score*8)*dt;k.y+=Math.cos(k.ph*2.1)*(80+score*5)*dt;k.x=Math.max(40,Math.min(320,k.x));k.y=Math.max(110,Math.min(430,k.y))}
  for(const h of hats){
    if(h.done)continue;h.t+=dt/h.dur;
    const left=(1-h.t)*h.dur;
    if(false&&left<0.3&&k.cd<=0&&k.dash<=0&&k.hit<=0&&Math.hypot(h.tx-k.x,h.ty-k.y)<70){
      let a=Math.atan2(k.y-h.ty,k.x-h.tx)+(Math.random()-.5)*2.2,d=110+Math.random()*50;
      let nx=k.x+Math.cos(a)*d,ny=k.y+Math.sin(a)*d;
      if(nx<40||nx>320)nx=k.x-Math.cos(a)*d;if(ny<110||ny>430)ny=k.y-Math.sin(a)*d;
      k.fx=k.x;k.fy=k.y;k.tx=Math.max(40,Math.min(320,nx));k.ty=Math.max(110,Math.min(430,ny));k.dash=0.18;k.cd=cdMax;
      pops.push({x:k.x,y:k.y-60,t:0.6,s:'ひょいっ'});
    }
    if(h.t>=1){h.done=true;h.t=1;
      if(Math.hypot(h.tx-k.x,h.ty-k.y)<40&&k.dash<=0&&k.hit<=0){score++;k.hit=0.9;time=Math.min(60,time+1.5);pops.push({x:k.x,y:k.y-70,t:1,s:'授けた！ +1'});
        setTimeout(()=>{if(state!=='play')return;const q=kid;q.fx=q.x;q.fy=q.y;q.tx=40+Math.random()*280;q.ty=130+Math.random()*290;q.dash=0.18;q.hit=0},600)}
      else pops.push({x:h.tx,y:h.ty,t:0.5,s:'…'});
      h.fade=0.4}
  }
  hats=hats.filter(h=>!h.done||(h.fade-=dt)>0);
  pops.forEach(p=>p.t-=dt);pops=pops.filter(p=>p.t>0);
}
function hat(x,y,s,rot){g.save();g.translate(x,y);g.rotate(rot||0);g.scale(s,s);
  g.fillStyle='#e8c15a';g.beginPath();g.ellipse(0,0,26,8,0,0,7);g.fill();
  g.beginPath();g.ellipse(0,-6,14,11,0,Math.PI,0);g.fill();
  g.fillStyle='#c0392b';g.fillRect(-14,-7,28,5);
  g.strokeStyle='#b8902f';g.lineWidth=1;g.beginPath();g.ellipse(0,0,26,8,0,0,7);g.stroke();g.restore()}
function head(x,y,hair,skin){g.fillStyle=skin;g.beginPath();g.arc(x,y,20,0,7);g.fill();
  g.fillStyle=hair;g.beginPath();g.arc(x,y-2,21,Math.PI,0);g.fill();g.fillRect(x-21,y-3,5,14);g.fillRect(x+16,y-3,5,14)}
function draw(){
  const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#7fd0ee');sky.addColorStop(.55,'#cdeefa');sky.addColorStop(.56,'#2b7fb5');sky.addColorStop(1,'#14507e');
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  g.fillStyle='#fff8';for(const[x,y,r]of[[60,70,22],[90,75,28],[270,110,24],[300,115,18]]){g.beginPath();g.arc(x,y,r,0,7);g.fill()}
  g.fillStyle='#a8743d';g.fillRect(0,590,W,50);g.fillStyle='#8a5d2e';for(let i=0;i<W;i+=45)g.fillRect(i,590,3,50);
  // captain
  g.fillStyle='#222';g.fillRect(cap.x-22,cap.y-30,44,70);
  g.fillStyle='#b33';g.fillRect(cap.x-22,cap.y-30,44,6);
  head(cap.x,cap.y-48,'#c0392b','#f1c9a0');
  g.fillStyle='#222';g.fillRect(cap.x-9,cap.y-48,3,5);g.fillRect(cap.x+6,cap.y-48,3,5);
  g.fillStyle='#f1c9a0';g.fillRect(cap.x+18,cap.y-30,26,8);
  if(Date.now()%1000>0)hat(cap.x+40,cap.y-36,.55,-.2);
  // kid
  const k=kid;if(k){g.save();g.globalAlpha=k.dash>0?.7:1;
    g.fillStyle='#d9362b';g.fillRect(k.x-14,k.y+16,28,34);g.fillStyle='#2a4a8a';g.fillRect(k.x-14,k.y+48,28,22);
    g.fillStyle='#f1c9a0';g.fillRect(k.x-26,k.y+18,12,8);g.fillRect(k.x+14,k.y+18,12,8);
    head(k.x,k.y,'#1a1a1a','#f1c9a0');
    g.fillStyle='#000';g.fillRect(k.x-9,k.y-2,3,5);g.fillRect(k.x+6,k.y-2,3,5);
    g.strokeStyle='#000';g.lineWidth=2;g.beginPath();g.arc(k.x,k.y+7,6,0,Math.PI);g.stroke();
    if(k.hit>0)hat(k.x,k.y-18,1,Math.sin(Date.now()/100)*.1);
    g.restore();
    if(k.dash<=0&&k.cd>0&&k.hit<=0){g.fillStyle='#fff';g.font='bold 11px sans-serif';g.textAlign='center';g.fillText('💦',k.x+30,k.y-20)}}
  // hats
  for(const h of hats){const p=h.t,x=h.sx+(h.tx-h.sx)*p,y=h.sy+(h.ty-h.sy)*p-Math.sin(p*Math.PI)*60;
    g.globalAlpha=h.done?Math.max(0,h.fade/0.4):1;
    if(!h.done){g.fillStyle='#0003';g.beginPath();g.ellipse(h.tx,h.ty+4,18,6,0,0,7);g.fill()}
    hat(x,y,.9*(1-p*.25),p*14);g.globalAlpha=1}
  g.textAlign='center';
  for(const p of pops){g.globalAlpha=Math.min(1,p.t*2);g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=3;g.font='bold 20px sans-serif';
    g.strokeText(p.s,p.x,p.y-(1-p.t)*20);g.fillText(p.s,p.x,p.y-(1-p.t)*20);g.globalAlpha=1}
  // HUD
  g.fillStyle='#0008';g.fillRect(0,0,W,44);g.fillStyle='#fff';g.font='bold 18px sans-serif';
  g.textAlign='left';g.fillText('授けた '+(score||0),14,29);g.textAlign='right';g.fillText('⏱ '+Math.ceil(time||0)+'  BEST '+best,W-14,29);
  if(state==='title'||state==='over'){
    g.fillStyle='#000a';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';
    if(state==='title'){g.font='bold 34px sans-serif';g.fillText('帽子を授けろ！',W/2,200);
      g.font='16px sans-serif';['画面をタップした場所へ帽子を投げる','少年は動き回る！先を読んで投げよう','授けるとすぐ別の場所へ移動するよ','40秒で何回授けられる？'].forEach((s,i)=>g.fillText(s,W/2,260+i*28));}
    else{g.font='bold 32px sans-serif';g.fillText('タイムアップ',W/2,210);g.font='bold 22px sans-serif';g.fillText('授けた数：'+score,W/2,265);g.fillText('ベスト：'+best,W/2,300)}
    g.font='bold 20px sans-serif';if(Math.floor(Date.now()/500)%2)g.fillText('タップでスタート',W/2,420);
  }
}
let ac,mg,nb,muted=false,mstep=0,mnext=0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MEL=[74,0,74,71,74,0,76,74, 71,0,71,67,71,0,74,71, 69,0,73,69,76,0,73,69, 74,73,71,69,66,69,74,0];
const BASS=[[38,45],[43,50],[45,52],[38,45]],STAB=[[62,66,69],[62,67,71],[61,64,69],[62,66,69]];
function tone(f,t,d,type,v){const o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(n);n.connect(mg);o.start(t);o.stop(t+d+.02)}
function noise(t,d,v,hp){const s=ac.createBufferSource(),n=ac.createGain(),f=ac.createBiquadFilter();s.buffer=nb;f.type='highpass';f.frequency.value=hp;n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(n);n.connect(mg);s.start(t);s.stop(t+d)}
function beat(s,t){const b=Math.floor(s/8)%4,i=s%8,m=MEL[s%32];
  if(m)tone(mtof(m),t,.22,'square',.07);
  if(i%4===0){tone(mtof(BASS[b][0]),t,.3,'triangle',.3);tone(120,t,.12,'sine',.35)}
  if(i%4===2){tone(mtof(BASS[b][1]),t,.25,'triangle',.25);STAB[b].forEach(x=>tone(mtof(x),t,.12,'sawtooth',.035));noise(t,.12,.15,1500)}
  if(i%2===1)noise(t,.04,.05,6000)}
function sched(){while(mnext<ac.currentTime+.15){beat(mstep%32,mnext);mnext+=.2;mstep++}}
function startMusic(){try{if(ac){ac.resume();return}
  ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=muted?0:.5;mg.connect(ac.destination);
  nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  mnext=ac.currentTime+.1;setInterval(sched,25)}catch(e){}}
const mb=document.getElementById('mb');
mb.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();startMusic();muted=!muted;if(mg)mg.gain.value=muted?0:.5;mb.textContent=muted?'🔇':'🔊'});
window.addEventListener('touchend',startMusic);
let last=performance.now();t0=last;spawnKid(true);
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
