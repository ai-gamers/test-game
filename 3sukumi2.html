<!DOCTYPE html>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f1f5f9;
        }
        
        .color-power { background-color: #ef4444; color: white; }
        .color-speed { background-color: #3b82f6; color: white; }
        .color-tech { background-color: #22c55e; color: white; }

        .btn-line {
            @apply flex-shrink-0 px-6 py-3 bg-white border border-gray-300 rounded-xl text-lg font-black text-gray-500 transition-all duration-200 shadow-sm;
            min-width: 60px;
            text-align: center;
        }
        .btn-line.active {
            @apply bg-blue-600 text-white border-blue-700 shadow-lg scale-110 z-10;
            outline: 4px solid rgba(37, 99, 235, 0.3);
        }
        .btn-line:not(.active):hover {
            @apply bg-gray-50 border-gray-400 text-gray-800;
        }

        .type-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 4px 6px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.7rem;
            width: 95px;
            white-space: nowrap;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .monster-card {
            @apply bg-white border border-gray-200 rounded-2xl overflow-hidden transition-all duration-200;
        }
        .monster-card:hover {
            @apply shadow-xl border-blue-200;
            transform: translateY(-2px);
        }
    </style>
</head>

        };
        
        // 鏖魔ディアブロス等、データが日本語で入った時の安全策用マッピング
        const jpToEngMap = {
            "パワー": "power",
            "スピード": "speed",
            "テクニック": "tech"
        };

        const lineMap = {
            "あ": /^[あ-おゔア-オヴ]/, "か": /^[か-こが-ごカ-コガ-ゴ]/, "さ": /^[さ-そざ-ぞサ-ソザ-ゾ]/,
            "た": /^[た-とだ-どタ-トダ-ド]/, "な": /^[な-のナ-ノ]/, "は": /^[は-ほば-ぼぱ-ぽハ-ホバ-ボパ-ポ]/,
            "ま": /^[ま-もマ-モ]/, "や": /^[や-よヤ-ヨ]/, "ら": /^[ら-ろラ-ロ]/, "わ": /^[わをんワヲン]/
        };

        let currentLine = 'all';
        let searchQuery = '';

        const grid = document.getElementById('monsterGrid');
        const noResults = document.getElementById('noResults');
        const resultCount = document.getElementById('resultCount');

        function render() {
            grid.innerHTML = '';
            
            const filtered = monsterData.filter(m => {
                const matchesSearch = m.name.includes(searchQuery) || m.kana.includes(searchQuery);
                const matchesLine = currentLine === 'all' || lineMap[currentLine].test(m.kana);
                return matchesSearch && matchesLine;
            }).sort((a, b) => a.kana.localeCompare(b.kana, 'ja'));

            resultCount.textContent = filtered.length;

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            filtered.forEach(m => {
                const card = document.createElement('div');
                card.className = "monster-card";
                
                let statesHtml = m.states.map(s => {
                    // 表記ゆれ対応
                    const engType = jpToEngMap[s.t] || s.t;
                    const sc = typeMap[engType];
                    
                    return `
                        <div class="flex justify-between items-center py-2.5 border-b border-gray-50 last:border-0 hover:bg-gray-50 px-2 -mx-2 rounded transition-colors">
                            <span class="text-gray-700 text-sm font-bold">${s.c}</span>
                            <div class="type-badge ${sc.color} shadow-sm">
                                <i class="fa-solid ${sc.icon}"></i>
                                <span>${sc.label}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="px-5 py-4 border-b border-gray-100 bg-gradient-to-r from-gray-50 to-white flex justify-between items-start">
                        <div>
                            <h3 class="font-black text-gray-900 text-lg leading-tight">${m.name}</h3>
                            <p class="text-[10px] text-gray-400 font-bold tracking-widest mt-1">${m.kana.toUpperCase()}</p>
                        </div>
                        <span class="text-[10px] text-blue-700 font-black px-2 py-1 bg-blue-50 border border-blue-200 rounded-md shadow-sm whitespace-nowrap">${m.element}</span>
                    </div>
                    <div class="p-5 space-y-1">
                        ${statesHtml}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        document.querySelectorAll('.btn-line').forEach(btn => {
            btn.addEventListener('click', () => {

                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
